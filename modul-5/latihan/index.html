<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Landing Page</title>
</head>

<body class="bg-white text-gray-800 dark:bg-gray-900 dark:text-gray-100">

<!-- NAVBAR -->
<nav class="flex justify-between items-center px-6 py-4 shadow-md bg-white dark:bg-gray-800">
  <h2 class="text-xl font-bold">MyBrand</h2>

  <ul class="hidden md:flex gap-6">
    <li class="hover:text-blue-500 cursor-pointer">Home</li>
    <li class="hover:text-blue-500 cursor-pointer">Fitur</li>
    <li class="hover:text-blue-500 cursor-pointer">Testimoni</li>
    <li class="hover:text-blue-500 cursor-pointer">Kontak</li>
  </ul>

  <!-- Toggle Dark Mode -->
  <button onclick="toggleDark()" class="ml-4 text-sm border px-3 py-1 rounded">
    Dark
  </button>
</nav>

<!-- HERO -->
<section class="text-center py-20 px-6 bg-gray-100 dark:bg-gray-800">
  <h1 class="text-3xl md:text-5xl font-bold mb-4">
    Produk Keren untuk Kamu
  </h1>
  <p class="mb-6 text-lg">
    Solusi modern untuk kebutuhan digital
  </p>
  <button class="btn">Mulai Sekarang</button>
</section>

<!-- FITUR -->
<section class="py-16 px-6">
  <h2 class="section-title">Fitur</h2>

  <div class="grid md:grid-cols-3 gap-6">
    <div class="card text-center">Fitur 1</div>
    <div class="card text-center">Fitur 2</div>
    <div class="card text-center">Fitur 3</div>
  </div>
</section>

<!-- TESTIMONI -->
<section class="py-16 px-6 bg-gray-100 dark:bg-gray-800">
  <h2 class="section-title">Testimoni</h2>

  <div class="grid md:grid-cols-3 gap-6">
    <div class="card">"Bagus banget!"</div>
    <div class="card">"Sangat membantu"</div>
    <div class="card">"Recommended!"</div>
  </div>
</section>

<!-- FOOTER -->
<footer class="bg-gray-900 text-white py-10 px-6">
  <div class="grid md:grid-cols-3 gap-6 text-center">
    <div>About</div>
    <div>Contact</div>
    <div>Social</div>
  </div>
</footer>

<script>
function toggleDark() {
  document.documentElement.classList.toggle('dark')
}
</script>

<script type="module" src="/src/main.js"></script>

</body>
</html>
