<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Profil</title>
    <link rel="stylesheet" href="style.css">
</head>
    <link rel="stylesheet" href="style.css">
<body>

    <header>
        <h1>Profil Mahasiswa</h1>
        <p>Welcome to My Personal Profile</p>
    </header>

    <nav>
        <a href="#tentang">Tentang</a>
        <a href="#keahlian">Keahlian</a>
        <a href="#kontak">Kontak</a>
    </nav>

    <section id="tentang" class="tentang">
        <img src="https://via.placeholder.com/200" alt="Foto Profil">
        <div class="bio">
            <h2>Tentang Saya</h2>
            <p>
                Halo, nama saya Nur Ihwan Nauval. Saya seorang mahasiswa semester 2
                yang sedang belajar HTML, CSS, dan JavaScript.
            </p>
        </div>
    </section>

    <section id="keahlian">
        <h2>Keahlian</h2>
        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>SQL</span>
        </div>
    </section>

    <section id="kontak">
        <h2>Kontak Saya</h2>
        <form>
            <label>Nama</label>
            <input type="text" placeholder="Masukkan nama">

            <label>Email</label>
            <input type="email" placeholder="Masukkan email">

            <label>Pesan</label>
            <textarea placeholder="Tulis pesan"></textarea>

            <button type="submit">Kirim</button>
        </form>
    </section>

    <footer>
        <p>© 2026 Nur Ihwan Nauval | All Rights Reserved</p>
    </footer>

</body>
</html>
