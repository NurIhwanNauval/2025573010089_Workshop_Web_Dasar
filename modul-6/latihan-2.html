<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Shopping Cart</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      gap: 20px;
      padding: 20px;
    }

    .products, .cart {
      flex: 1;
    }

    .card {
      border: 1px solid #ddd;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    img {
      width: 100%;
      border-radius: 5px;
    }

    button {
      margin-top: 5px;
      cursor: pointer;
    }

    .cart-item {
      border-bottom: 1px solid #ccc;
      padding: 5px 0;
    }

    .total {
      font-weight: bold;
      margin-top: 10px;
    }

    .badge {
      background: red;
      color: white;
      padding: 2px 6px;
      border-radius: 50%;
      font-size: 12px;
    }
  </style>
</head>
<body>

<div class="products">
  <h2>Produk</h2>
  <div id="product-list"></div>
</div>

<div class="cart">
  <h2>Keranjang <span id="cart-count" class="badge">0</span></h2>
  <div id="cart-list"></div>
  <div class="total" id="total">Total: Rp 0</div>
  <button id="checkout">Checkout</button>
</div>

<script src="latihan-2.js"></script>
</body>
</html>
